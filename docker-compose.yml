services:
  # One-off historical backfill. Run manually: docker compose run --rm mikrotik-fullscan
  mikrotik-fullscan:
    build: .
    container_name: mikrotik-fullscan
    volumes:
      - ./mikrotik_archive:/app/mikrotik_archive
    command: ["scan", "--output", "/app/mikrotik_archive", "--start", "3.30", "--end", "7.99", "--test-workers", "24", "--dl-workers", "10"]

  # Daily check for new releases. Runs once per container start; pair with a
  # host cron/systemd timer, or set `restart: unless-stopped` and swap the
  # command to `["watch", "--interval-hours", "24", "--output", "/app/mikrotik_archive"]`
  # to keep it running continuously instead.
  mikrotik-watch:
    build: .
    container_name: mikrotik-watch
    volumes:
      - ./mikrotik_archive:/app/mikrotik_archive
    command: ["watch", "--once", "--output", "/app/mikrotik_archive"]
